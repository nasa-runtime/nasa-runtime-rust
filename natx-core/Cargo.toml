[package]
name = "natx-core"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Backend-neutral datasource ownership, transaction outcomes, and atomic connection observability"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["database", "transaction", "datasource", "observability", "async"]
categories = ["asynchronous", "database"]
readme = "README.md"

[dependencies]
anyhow = "1"
nametrics-core = { version = "1.0.2" }
nanotify-core = { version = "1.0.0", path = "../nanotify-core" }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
