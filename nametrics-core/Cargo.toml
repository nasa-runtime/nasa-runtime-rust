# nametrics-core：进程级 provider-neutral 指标核心。
#
# 唯一进程级 descriptor catalog + 进程内记录 + 结构化导出。**不依赖** OpenTelemetry、
# Prometheus client、Axum,也**不依赖 napp**——否则 nafana/naweb/nafka 接入时会形成反向依赖。
# Web scrape adapter 与 Telemetry OTLP exporter 各自读取同一 MetricHub,不重新拥有领域指标语义。
[package]
name = "nametrics-core"
version = "1.0.2"
edition.workspace = true
rust-version.workspace = true
description = "Provider-neutral metric catalog with atomic series budgets and shared structured/Prometheus snapshots"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["metrics", "prometheus", "observability", "telemetry", "monitoring"]
categories = ["development-tools::profiling"]

[lib]
name = "nametrics_core"

[dependencies]
