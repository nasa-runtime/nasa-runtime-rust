[package]
name = "naidempotency-pgsql"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
description = "PostgreSQL idempotency store with named ambient transactions, lease fencing, and durable replay"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["postgresql", "idempotency", "transaction", "database"]
categories = ["database", "web-programming"]
readme = "README.md"

[dependencies]
naidempotency = { version = "2.0.0" }
natx-pgsql = { version = "2.0.0" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
async-trait = "0.1"
serde_json = "1"
