[package]
name = "napp"
version = "1.0.3"
edition.workspace = true
rust-version.workspace = true
description = "Managed named resources and configuration snapshots with gated activation, ordered shutdown, datasource-bound Saga, SQL observability and business notifications"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["runtime", "lifecycle", "observability", "graceful-shutdown", "saga"]
categories.workspace = true

[features]
default = []
# 每个内置组件按需拉取其重实现依赖，避免 web-only 应用编译 log/db/redis/nacos 等重依赖
# 并由 nasa 门面经 `application_impl?/<组件>` 弱依赖桥打开。
log = ["dep:nalog"]
config-watch = ["naml/watch"]
secret-vault = ["dep:nasecret-vault"]
secret-http = ["dep:nasecret-http", "dep:reqwest"]
object-store = ["dep:naobject", "naobject/metrics", "dep:async-trait"]
# Mapper 的固定指标、连接策略和有界通知由运行时自动装配。
mapper-observability = ["dep:namapper-core", "dep:natx-core", "dep:nanotify-core"]
observability = ["dep:nafana", "tokio/net"]
# nacos-config 配置中心：API 编入即可用 disabled 本地路径；真实连接由 nacos-config-sdk 打开 nanacos 后端。
nacos-config = ["dep:config-boot", "dep:nanacos"]
nacos-config-sdk = ["nacos-config", "nanacos/nacos"]
# db/db-pgsql：两种 typed 数据源共享 catalog 与生命周期，napp 不直接依赖 SQLx；
# migration 门禁由对应 adapter 提供，在 DB 组件 Prepare 执行且不新增组件字符串。
db = ["dep:natx-core", "dep:natx", "dep:namigrate"]
db-pgsql = ["dep:natx-core", "dep:natx-pgsql", "dep:namigrate-core", "dep:namigrate-pgsql"]
# redis：统一客户端建连与显式停机由 nadis 提供，napp 只做编排。
redis = ["dep:nadis", "cacheable?/managed-redis"]
# redis-job：在 Redis 多实例资源之上托管计划准备、领取、对账与有预算停机。
redis-job = ["redis", "nadis/job", "dep:prost"]
# rate-limit：跨副本分布式业务配额，由 RateLimitProvider 抽象和 nadis Redis 固定窗口后端实现。
rate-limit = ["redis", "dep:async-trait"]
# telemetry：OpenTelemetry traces 组件；natelemetry 是硬依赖，本 feature 只门控组件与声明字符串。
# OTLP wire exporter 使用 reqwest 发送 OTLP/HTTP JSON。
telemetry = ["dep:reqwest"]
# partition：Prepare 批量启动命名 Runner，逐域聚合 readiness，并在反向停机中取得退出证明。
partition = ["dep:napart"]
# 稳定 gRPC listener：业务登记 generated service，Application 自动装配协议能力并托管生命周期。
grpc = ["dep:nagrpc"]
# cache：两级缓存组件；cacheable 提供 L2 与失效广播，napp 托管 CacheRuntimeGuard 生命周期。
cache = ["dep:cacheable", "dep:async-trait"]
# Kafka：受管 producer/consumer、broker Ready、动态健康和两段停机由 napp 编排。
kafka = ["dep:futures", "dep:nafka"]
kafka-schema-registry = ["kafka", "nafka/schema-registry-metrics", "dep:async-trait"]
# Outbox：在 UserHook 接收发布端，Ready 后按 datasource driver 监督 dispatcher；可脱离 Saga 独立使用。
outbox = ["db", "dep:naoutbox-core", "dep:naoutbox-mysql", "dep:async-trait"]
outbox-pgsql = ["db-pgsql", "dep:naoutbox-core", "dep:naoutbox-pgsql", "dep:async-trait"]
# Inbox retention：业务显式提交保留策略后，由 Application 串行执行清理轮次并发布统一指标。
inbox = ["db", "dep:nainbox-core", "dep:nainbox-mysql"]
inbox-pgsql = ["db-pgsql", "dep:nainbox-core", "dep:nainbox-pgsql"]
# Saga：managed 按受信角色配置自动装配，custom 才在 UserHook 接收显式运行计划。
# Ready 前执行角色合同门禁；数据角色监督 timer/消费循环，可靠 client 的 append 与 dispatcher 绑定同源。
saga = ["db", "inbox", "outbox", "dep:nasaga-runtime", "dep:async-trait", "dep:reqwest", "dep:ncrypto", "dep:hex"]
saga-pgsql = ["db-pgsql", "inbox-pgsql", "outbox-pgsql", "dep:nasaga-runtime-pgsql", "dep:async-trait", "dep:reqwest", "dep:ncrypto", "dep:hex"]
# Saga Kafka 受管 transport：Saga 在 Kafka Ready 前登记消费者，并从同一 client 构造 Outbox 发布端。
saga-kafka = ["saga", "kafka", "dep:base64", "nasaga-runtime/kafka", "nasaga-runtime-pgsql?/kafka"]
saga-kafka-pgsql = ["saga-pgsql", "kafka", "dep:base64", "nasaga-runtime-pgsql/kafka", "nasaga-runtime?/kafka"]
# Saga 的 Redis Streams 受管 transport:组件在 Ready 前校验拓扑/group/route owner,
# 消费循环受 Runner 监督,停机先关领取再排空、最后由 Redis 组件释放连接。
saga-redis-stream = ["saga", "redis", "dep:hex", "nasaga-runtime/redis-stream", "nasaga-runtime-pgsql?/redis-stream"]
saga-redis-stream-pgsql = ["saga-pgsql", "redis", "dep:hex", "nasaga-runtime-pgsql/redis-stream", "nasaga-runtime?/redis-stream"]
# Saga request/response transport：计划自动把框架 generated service 登记到同一 gRPC registry。
saga-grpc = ["saga", "grpc", "dep:prost", "dep:http-body", "nasaga-runtime/grpc-transport", "nasaga-runtime-pgsql?/grpc-transport"]
saga-grpc-pgsql = ["saga-pgsql", "grpc", "dep:prost", "dep:http-body", "nasaga-runtime-pgsql/grpc-transport", "nasaga-runtime?/grpc-transport"]
# Web：自动端点收集、确定的 HTTP/1/h2c 监听与排空；无 Web 的批处理不编译路由和网络依赖。
web = ["dep:axum", "dep:hyper", "dep:hyper-util", "dep:http-body", "dep:naweb", "dep:matchit", "dep:tower", "dep:tower-http", "dep:nauth-oauth", "dep:naopenapi", "dep:ipnet", "dep:reqwest", "tokio/net"]
# Web 安全端点：把 naweb 的 auth/crypto 组合显式编入 Application 容器路径。
web-auth = ["web", "naweb/auth"]
web-crypto = ["web", "naweb/crypto"]
web-security = ["web-auth", "web-crypto"]
# scheduling：启动/关闭 `#[scheduled]` 任务；cluster 模式另需 nasched 的 nadis 适配层与 redis 组件。
# Mapper 缓存标准装配与 Service/Batch 启动门禁；复用指定受管 Redis。
# MySQL 路径同步开放 namapper 的 Redis 实现；PostgreSQL 路径只依赖后端中立缓存运行时。
mapper-cache = ["redis", "dep:namapper-core", "namapper-core/redis-cache", "dep:namapper", "namapper/redis-cache"]
mapper-cache-pgsql = ["redis", "dep:namapper-core", "namapper-core/redis-cache"]
# ws：长连接服务（TCP/WebSocket）；鉴权与 endpoint 事件表由业务经 configure_ws 注入。
ws = ["dep:naws"]
ws-redis = ["ws", "redis", "naws/redis"]
ws-kafka = ["ws", "kafka", "naws/kafka"]
# nacos-discovery：分段生命周期（出站 runtime / 本实例注册 / 关闭后台任务）由 rest-discovery-nacos 提供。
nacos-discovery = ["dep:rest-discovery-nacos"]
rest = ["dep:rest-discovery", "dep:nadisc"]
# 真实注册中心后端；门面依赖会统一底层包的能力开关，直连 napp 时也可显式启用。
nacos-discovery-sdk = ["nacos-discovery", "rest-discovery-nacos/nacos-sdk"]
scheduling = ["dep:nasched"]
scheduling-cluster = ["scheduling", "nasched/cluster", "redis"]

# 持久 adapter 在既有数据源准备之后装配；启用 feature 不等于启用任何实例。
idempotency-mysql = ["db", "dep:naidempotency-mysql", "dep:async-trait"]
idempotency-pgsql = ["db-pgsql", "dep:naidempotency-pgsql", "dep:async-trait"]
idempotency-redis = ["redis", "dep:naidempotency-redis", "dep:async-trait"]
audit-mysql = ["db", "dep:naaudit", "dep:naaudit-mysql", "dep:naoutbox-mysql", "dep:async-trait"]
audit-pgsql = ["db-pgsql", "dep:naaudit", "dep:naaudit-pgsql", "dep:naoutbox-pgsql", "dep:async-trait"]

[dependencies]
nasecret-vault = { version = "1.0.1", optional = true }
nasecret-http = { version = "1.0.1", optional = true }
naobject = { version = "1.0.1", optional = true }
anyhow = "1"
unicode-normalization = "0.1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
arc-swap = "1"
base64 = { version = "0.22", optional = true }
axum = { version = "0.8", optional = true }
hyper = { version = "1", features = ["http1", "http2", "server"], optional = true }
hyper-util = { version = "0.1", features = ["service", "tokio"], optional = true }
config-boot = { version = "1.0.2", optional = true }
futures = { version = "0.3", optional = true }
futures-util = "0.3"
http-body = { version = "1", optional = true }
linkme = "0.3"
naweb = { version = "1.0.2", optional = true }
matchit = { version = "0.8", optional = true }
naml = { version = "1.0.3" }
nametrics-core = { version = "1.0.2" }
nanotify-core = { version = "1.0.0", optional = true }
nafana = { version = "1.0.2", optional = true }
nabudget = { version = "1.0.2" }
nasecret = { version = "1.0.1" }
naidempotency = { version = "1.0.2" }
naauthz = { version = "1.0.2" }
natelemetry = { version = "1.0.2" }
napart = { version = "1.1.2", optional = true }
nagrpc = { version = "1.0.2", optional = true }
ncrypto = { version = "1.0.1", optional = true }
hex = { version = "0.4", optional = true }
# authentication 中间件依赖:JWT 验签 + JWKS 生命周期(仅 web 特性拉入,避免非 web 构建引入 ncrypto)。
nauth-oauth = { version = "1.0.1", optional = true }
naopenapi = { version = "1.0.2", optional = true }
# 仅 web 特性使用：auth 组件远程拉取 `jwks_uri`；rustls-tls 对齐 rest-discovery 的 TLS 栈。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
namapper-core = { version = "1.0.0", optional = true, default-features = false }
namapper = { version = "1.0.2", optional = true, default-features = false }
natx = { version = "1.0.3", optional = true }
natx-core = { version = "1.0.0", optional = true }
natx-pgsql = { version = "1.0.0", optional = true }
namigrate = { version = "1.0.1", optional = true }
namigrate-core = { version = "1.0.0", optional = true }
namigrate-pgsql = { version = "1.0.0", optional = true }
cacheable = { version = "1.0.2", optional = true }
# 仅 cache 组件使用：实现 cacheable 的 async trait `CacheBackend`，适配受管 Redis 连接。
async-trait = { version = "0.1", optional = true }
nadis = { version = "1.0.2", optional = true }
prost = { version = "0.14", optional = true }
nalog = { version = "1.0.1", optional = true }
nafka = { version = "1.0.3", optional = true, default-features = false }
naoutbox-core = { version = "1.0.2", optional = true }
naoutbox-mysql = { version = "1.0.2", optional = true }
naoutbox-pgsql = { version = "1.0.0", optional = true }
nainbox-core = { version = "1.0.2", optional = true }
nainbox-mysql = { version = "1.0.2", optional = true }
nainbox-pgsql = { version = "1.0.0", optional = true }
nasaga-runtime = { version = "1.0.2", optional = true }
nasaga-runtime-pgsql = { version = "1.0.0", optional = true }
nanacos = { version = "1.0.2", optional = true, default-features = false }
nasched = { version = "1.0.2", optional = true }
naws = { version = "1.0.2", optional = true, default-features = false }
rest-discovery-nacos = { version = "1.0.2", optional = true, default-features = false }
rest-discovery = { version = "1.0.2", optional = true }
nadisc = { version = "1.0.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "=1.52.3", features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["trace", "catch-panic", "compression-gzip", "timeout"], optional = true }
tower = { version = "0.5", features = ["limit"], optional = true }
ipnet = { version = "2", optional = true }
tracing = "0.1"
rand = "0.8"
sha2 = "0.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"
uuid = { version = "1", features = ["v5"] }

naidempotency-mysql = { version = "1.0.2", optional = true }
naidempotency-pgsql = { version = "1.0.0", optional = true }
naidempotency-redis = { version = "1.0.2", optional = true }
naaudit = { version = "1.0.1", optional = true }
naaudit-mysql = { version = "1.0.2", optional = true }
naaudit-pgsql = { version = "1.0.0", optional = true }
