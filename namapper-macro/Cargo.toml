# mapper-macro —— 声明式 Mapper trait 生成宏
[package]
name = "namapper-macro"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Declarative SQL mapper macros with static method catalogs and query lifecycle observability"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["mapper", "sql", "macro", "database", "observability"]
categories = ["development-tools::procedural-macro-helpers", "database"]

[lib]
proc-macro = true
name = "namapper_macro"

[dependencies]
nasa-macro-support = { package = "macro-support", version = "2.0.0" }
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
