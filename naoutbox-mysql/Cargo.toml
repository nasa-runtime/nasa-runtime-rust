[package]
name = "naoutbox-mysql"
version = "1.0.2"
edition.workspace = true
rust-version.workspace = true
description = "NASA MySQL Outbox with named natx datasource binding, transactional append and polling dispatch"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["mysql", "outbox", "transaction", "messaging", "database"]
categories = ["database", "asynchronous"]

[dependencies]
async-trait = "0.1"
naoutbox-core = { version = "1.0.2" }
natx = { version = "1.0.3" }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "mysql"] }
tokio = { version = "1", features = ["sync"] }
