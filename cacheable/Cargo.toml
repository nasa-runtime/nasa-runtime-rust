# cacheable —— 两级缓存运行时:L1(moka)+L2(redis 三防)+ #[cached]/#[cache_invalidate] 运行端
# 业务项目优先依赖 nasa 门面并开启 cache feature；内部迁移可直接依赖 cacheable 包。
[package]
name = "cacheable"
version = "1.0.2"
edition.workspace = true
rust-version.workspace = true
description = "L1/L2 缓存、Redis 分组缓存、有界刷新与失效广播，分离事务持久失效意图和提交后缓存操作"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true


[lib]
name = "cacheable"
[features]
default = []
# managed-redis：允许宿主把已有 nadis 客户端交给失效广播，避免组件私自建立第二套命令连接。
managed-redis = ["dep:nadis"]

[dependencies]
tokio-util = { version = "0.7", features = ["rt"] }
nacache-macro = { package = "nacache-macro", version = "1.0.2" }
nadis = { version = "1.0.2", optional = true }
redis = { version = "1", features = ["tokio-comp", "connection-manager", "cluster-async"] }
moka = { version = "0.12", features = ["future"] }
dashmap = "6"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# `CacheBackend` 抽象需要对象安全的 async trait(`Arc<dyn CacheBackend>`),原生 async-fn-in-trait
# 原生 async-fn-in-trait 尚不支持 dyn，因此使用 async-trait 保持窄接口并隔离具体 Redis 连接类型。
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
futures-util = "0.3"
tracing = "0.1"
# 编译期收集 #[cached] 生成的 CacheSceneUsage 静态 descriptor，与 naweb-macro 使用同类机制。
linkme = "0.3"
