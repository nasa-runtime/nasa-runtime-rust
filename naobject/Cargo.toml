[package]
name = "naobject"
version = "1.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Bounded object storage contract with an S3-compatible SigV4 adapter and explicit integrity checks"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["object-storage", "s3", "sigv4", "storage", "async"]
categories = ["asynchronous", "web-programming::http-client"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
hmac = "0.12"
nasecret = { version = "1.0.0" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
zeroize = "1"
