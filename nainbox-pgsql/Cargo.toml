[package]
name = "nainbox-pgsql"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
description = "PostgreSQL Inbox backend with named ambient transactions and target-key deduplication"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["postgresql", "inbox", "transaction", "messaging"]
categories = ["database", "asynchronous"]
readme = "README.md"

[dependencies]
anyhow = "1"
async-trait = "0.1"
nainbox-core = { version = "2.0.0" }
natx-pgsql = { version = "2.0.0" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = { version = "1", features = ["time"] }
# 保留清理的 advisory lock 归还失败必须留下告警证据,否则后续轮次持续 contended 无从定位。
tracing = "0.1"
