[package]
name = "nasaga-mysql"
version = "1.0.1"
edition.workspace = true
rust-version.workspace = true
description = "NASA Saga MySQL store: instance/step/attempt/transition/timer with CAS inside the ambient natx transaction"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow = "1"
nasaga-core = { version = "1.0.0" }
# Saga store、Inbox 与 Outbox 必须共享 natx 的同一 ambient transaction。
natx = { version = "1.0.2" }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "mysql"] }
uuid = { version = "1", features = ["v4", "v5"] }
