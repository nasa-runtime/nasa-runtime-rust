[package]
name = "nasaga-mysql"
version = "1.0.2"
edition.workspace = true
rust-version.workspace = true
description = "Durable named-datasource MySQL store for NASA Saga state, fencing, audit, quotas and recovery"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["saga", "mysql", "workflow", "compensation", "microservices"]
categories = ["asynchronous", "database"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
nasaga-backend = { version = "1.0.0" }
nasaga-core = { version = "1.0.1" }
# Saga store、Inbox 与 Outbox 必须共享 natx 的同一 ambient transaction。
natx = { version = "1.0.3" }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "mysql"] }
uuid = { version = "1", features = ["v4", "v5"] }
