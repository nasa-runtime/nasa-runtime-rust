# config-boot：编排 yml 配置加载与 Nacos 配置中心的引导流程。
# yml 对 Nacos 零认知、nacos 对 yml 零认知;本 crate 在两者之上把「按 import 拉远端配置、拼有序 overlay」编排落地。
# 业务经门面 `use nasa::yml::nacos::{...};` 使用(crate 真名 config-boot,业务无感知)。
[package]
name = "config-boot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "yml × nacos 配置引导胶水:按 import 拉取远端配置、拼装有序 overlay(nasa::yml::nacos)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true


[lib]
name = "config_boot"
[dependencies]
naml = { package = "naml", version = "1.0.0" }
# 只用 nacos 的类型(ConfigRef/ConfigBundle)与 client 方法(fetch_many);default-features=false 不自带 SDK,
# 真实后端由上层 app 经 nasa/nacos-sdk 打开(cargo 特性统一后本 crate 也拿到真后端)。
nanacos = { package = "nanacos", version = "1.0.0", path = "../nanacos", default-features = false }
serde_json = "1"
# 为 NacosBootstrap 与 NacosImportSpec 提供 serde derive。
serde = { version = "1", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
# 仅用 tokio::fs 做本地 file: import 的异步读取,避免在 async 装配/热刷新路径上阻塞 runtime worker。
tokio = { version = "1", features = ["fs"] }
