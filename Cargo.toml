# nasa-runtime-rust —— NASA Rust 共享组件工作区。
# 业务应用以 `nasa` 为门面并按 feature 选择能力；组件 crate 负责具体运行时、adapter 与宏展开。
# 直接依赖组件 crate 时，调用方必须自行承担其 README 声明的初始化、生命周期和安全边界。
[workspace]
resolver = "2"
members = [
    "nasa",
    "napp",
    "napp-macro",
    "macro-support",
    "naweb",
    "namapper-macro",
    "namapper-core",
    "namapper",
    "namapper-pgsql",
    "hystrix-macro", "hystrix",
    "nafana-macro", "nafana",
    "nacache-macro", "cacheable",
    "natx-macro", "natx-core", "natx", "natx-pgsql",
    "async-macro", "nasched",
    "naweb-macro",
    "napart",
    "naws-proto-derive",
    "naws-proto",
    "naws",
    "nafka",
    "nafka-macro",
    "nadis",
    "nadis-derive",
    "ncrypto",
    "nanum",
    "nametrics-core",
    "nanotify-core",
    "nagrpc",
    "nagrpc-build",
    "naobject",
    "nasecret",
    "nasecret-http",
    "nasecret-vault",
    "nabudget",
    "natelemetry",
    "nauth-oauth",
    "naidempotency",
    "naidempotency-mysql",
    "naidempotency-pgsql",
    "naidempotency-redis",
    "naoutbox-core",
    "naoutbox-mysql",
    "naoutbox-pgsql",
    "nainbox-core",
    "nainbox-mysql",
    "nainbox-pgsql",
    "nasaga-core",
    "nasaga-backend",
    "nasaga-mysql",
    "nasaga-pgsql",
    "nasaga-runtime-core",
    "nasaga-runtime",
    "nasaga-runtime-pgsql",
    "nasaga-macro",
    "naopenapi",
    "namigrate-core",
    "namigrate",
    "namigrate-pgsql",
    "naauthz",
    "naaudit",
    "naaudit-mysql",
    "naaudit-pgsql",
    "naimg",
    "nalog",
    "nabase",
    "naml",
    "config-boot",
    "nadisc",
    "nanacos",
    "rest-discovery",
    "rest-client-macro",
    "rest-discovery-nacos",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nasa-runtime/nasa-runtime-rust"
homepage = "https://github.com/nasa-runtime/nasa-runtime-rust"
keywords = ["runtime", "backend", "microservices", "async"]
categories = ["asynchronous", "web-programming"]

# 成员间依赖使用公开版本约束；保留的 workspace patch 统一相应 crate 的本地依赖身份。
# 归档的 normalized manifest 使用 registry 版本，不携带本地 path 或根工作区 patch。
[patch.crates-io]
# 覆盖项统一门面与实现的本地依赖身份；未覆盖组件由 registry 解析。
namapper = { path = "namapper" }
namapper-pgsql = { path = "namapper-pgsql" }
# 进程一致性依赖必须单来源:task-local 事务上下文与 Inbox 访问若在同一图里出现
# 本地/registry 双身份,ambient 事务和幂等门禁会静默失效。
nainbox-mysql = { path = "nainbox-mysql" }
nainbox-pgsql = { path = "nainbox-pgsql" }
naidempotency-mysql = { path = "naidempotency-mysql" }
naidempotency-pgsql = { path = "naidempotency-pgsql" }
naoutbox-pgsql = { path = "naoutbox-pgsql" }
naaudit-mysql = { path = "naaudit-mysql" }
naaudit-pgsql = { path = "naaudit-pgsql" }
# 同一依赖图中的组件必须统一来源，避免本地覆盖与 registry 副本造成类型不兼容或状态分裂。
nasaga-mysql = { path = "nasaga-mysql" }
nasaga-pgsql = { path = "nasaga-pgsql" }
nasaga-runtime-core = { path = "nasaga-runtime-core" }
nasaga-runtime = { path = "nasaga-runtime" }
nasaga-runtime-pgsql = { path = "nasaga-runtime-pgsql" }
naoutbox-mysql = { path = "naoutbox-mysql" }
# 门面与 Application 生命周期必须共享同一 napp 类型身份，避免受管句柄和组件快照分裂。
napp = { path = "napp" }
nasa = { path = "nasa" }
