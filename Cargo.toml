# nasa-runtime-rust —— NASA Rust 共享组件工作区。
# 业务应用以 `nasa` 为门面并按 feature 选择能力；组件 crate 负责具体运行时、adapter 与宏展开。
# 直接依赖组件 crate 时，调用方必须自行承担其 README 声明的初始化、生命周期和安全边界。
[workspace]
resolver = "2"
members = [
    "nasa",
    "napp",
    "napp-macro",
    "macro-support",
    "naweb",
    "namapper-macro",
    "namapper-core",
    "namapper",
    "namapper-pgsql",
    "namapper-sqlite",
    "hystrix-macro", "hystrix",
    "nafana-macro", "nafana",
    "nacache-macro", "cacheable",
    "natx-macro", "natx-core", "natx", "natx-pgsql",
    "natx-sqlite",
    "async-macro", "nasched",
    "naweb-macro",
    "napart",
    "naws-proto-derive",
    "naws-proto",
    "naws",
    "nafka",
    "nafka-macro",
    "nadis",
    "nadis-derive",
    "ncrypto",
    "nanum",
    "nametrics-core",
    "nanotify-core",
    "nagrpc",
    "nagrpc-build",
    "naobject",
    "nasecret",
    "nasecret-http",
    "nasecret-vault",
    "nabudget",
    "natelemetry",
    "nauth-oauth",
    "naidempotency",
    "naidempotency-mysql",
    "naidempotency-pgsql",
    "naidempotency-redis",
    "naoutbox-core",
    "naoutbox-mysql",
    "naoutbox-pgsql",
    "nainbox-core",
    "nainbox-mysql",
    "nainbox-pgsql",
    "nasaga-core",
    "nasaga-backend",
    "nasaga-mysql",
    "nasaga-pgsql",
    "nasaga-runtime-core",
    "nasaga-runtime",
    "nasaga-runtime-pgsql",
    "nasaga-macro",
    "naopenapi",
    "namigrate-core",
    "namigrate",
    "namigrate-pgsql",
    "namigrate-sqlite",
    "naauthz",
    "naaudit",
    "naaudit-mysql",
    "naaudit-pgsql",
    "naimg",
    "nalog",
    "nabase",
    "naml",
    "config-boot",
    "nadisc",
    "nadisc-runtime",
    "nadisc-consul",
    "nadisc-kubernetes",
    "nanacos-sdk",
    "nanacos",
    "rest-discovery",
    "rest-client-macro",
    "rest-discovery-nacos",
]

[workspace.package]
version = "2.0.6"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nasa-runtime/nasa-runtime-rust"
homepage = "https://github.com/nasa-runtime/nasa-runtime-rust"
keywords = ["runtime", "backend", "microservices", "async"]
categories = ["asynchronous", "web-programming"]

# 未发布的组件依赖使用当前检出的源码；版本要求仍由各组件 manifest 约束。
# 已发布的前置依赖解除覆盖并从 crates.io 解析；保留的映射不进入规范化归档。
[patch.crates-io]
nasa = { path = "nasa" }
