# ============================================================================
# nasa-runtime-rust —— NASA Rust 共享组件工作区
#
# ★ 业务唯一入口 = `nasa` 门面 crate(单一公共入口 + 模块分区 + feature 按需):
#     nasa = { ..., features = ["hystrix", "cache", "tx", "scheduling", "web", "ws-redis"] }
#     use nasa::hystrix::hystrix;  use nasa::ws::Server;  #[nasa::web::get_mapping("/x")]
#   其余成员都是【实现细节】,业务项目不得直接依赖;
#   旧式直接依赖(hystrix/cacheable/...)仍兼容(宏按"旧直接依赖优先"解析),仅供渐进迁移。
#
# 成员:
#   *-macro   过程宏(proc-macro crate)
#   hystrix   熔断/监控门面(Command/stream + #[hystrix])
#   nafana    接口级隔离监控(Prometheus/Grafana 出口 + #[grafana])
#   cacheable 两级缓存门面(L1 moka + L2 redis 三防 + #[cached]/#[cache_invalidate])
#   tx        事务门面(task_local ambient 事务 + #[transactional])
#   scheduling 异步/定时门面(tokio-cron-scheduler + #[Async]/#[Scheduled]/#[EnableAsync])
#   naweb      Web 路由、interceptor 与端点安全运行时
#   naweb-macro 路由注解(#[get_mapping]/#[post_mapping]/#[put_mapping]/#[delete_mapping]/#[patch_mapping] + mvc_router!,收集点在用户 crate 生成)
# ============================================================================
[workspace]
resolver = "2"
members = [
    "nasa",
    "napp",
    "napp-macro",
    "macro-support",
    "naweb",
    "namapper-macro",
    "namapper",
    "hystrix-macro", "hystrix",
    "nafana-macro", "nafana",
    "nacache-macro", "cacheable",
    "natx-macro", "natx",
    "async-macro", "nasched",
    "naweb-macro",
    "napart",
    "naws-proto-derive",
    "naws-proto",
    "naws",
    "nafka",
    "nafka-macro",
    "nadis",
    "nadis-derive",
    "ncrypto",
    "nanum",
    "nadate",
    "nametrics-core",
    "nagrpc",
    "naobject",
    "nasecret",
    "nasecret-http",
    "nasecret-vault",
    "nabudget",
    "natelemetry",
    "nauth-oauth",
    "naidempotency",
    "naidempotency-mysql",
    "naidempotency-redis",
    "naoutbox-core",
    "naoutbox-mysql",
    "nainbox-core",
    "nainbox-mysql",
    "nasaga-core",
    "nasaga-mysql",
    "nasaga-runtime",
    "nasaga-macro",
    "naopenapi",
    "namigrate",
    "naauthz",
    "naaudit",
    "naaudit-mysql",
    "naimg",
    "nalog",
    "nabase",
    "naml",
    "config-boot",
    "nadisc",
    "nanacos",
    "rest-discovery",
    "rest-client-macro",
    "rest-discovery-nacos",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nasa-runtime/nasa-runtime-rust"
homepage = "https://github.com/nasa-runtime/nasa-runtime-rust"
keywords = ["runtime", "backend", "microservices", "async"]
categories = ["asynchronous", "web-programming"]

# 本地开发期统一来源:成员间依赖固定公开坐标(见各 crate manifest 注释),跨 crate 改动经
# workspace patch 指向本地路径,发布前移除对应条目并按依赖序发版。
[patch.crates-io]
# 进程一致性依赖必须单来源:task-local 事务上下文与 Inbox 访问若在同一图里出现
# 本地/registry 双身份,ambient 事务和幂等门禁会静默失效。
natx = { path = "natx" }
nainbox-mysql = { path = "nainbox-mysql" }
# 同版本双身份消除:成员既按 path 直依赖、又经其它成员的公开坐标传递引用的 crate,
# 必须统一来源,否则类型跨身份流动即编译失败或行为分裂。
ncrypto = { path = "ncrypto" }
naaudit = { path = "naaudit" }
naws-proto = { path = "naws-proto" }
rest-discovery = { path = "rest-discovery" }
async-macro = { path = "async-macro" }
nasaga-core = { path = "nasaga-core" }
nasaga-mysql = { path = "nasaga-mysql" }
nasaga-runtime = { path = "nasaga-runtime" }
nasaga-macro = { path = "nasaga-macro" }
naoutbox-core = { path = "naoutbox-core" }
naoutbox-mysql = { path = "naoutbox-mysql" }
# 门面对 napp 用公开坐标声明，缺这一条会让工作区内的 nasa 解析到 registry 上的旧 napp，
# 组合组件的新能力在本地构建里等于不存在。
napp = { path = "napp" }
napp-macro = { path = "napp-macro" }
nadis = { path = "nadis" }
