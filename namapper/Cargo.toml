# mapper —— 声明式 Mapper 运行时桥 + re-export #[Mapper]/#[Query]
[package]
name = "namapper"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Declarative MySQL mapper with ambient transactions, atomic SQL metrics, and bounded threshold notifications"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["mysql", "mapper", "sql", "database", "observability"]
categories = ["database", "asynchronous"]

[lib]
name = "namapper"

[features]
default = []
grouped-cache = ["dep:cacheable"]
redis-cache = ["namapper-core/redis-cache"]

[dependencies]
namapper-core = { version = "2.0.0" }
namapper-macro = { package = "namapper-macro", version = "2.0.0" }
natx = { package = "natx", version = "2.0.0" }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "mysql", "chrono", "json"] }
async-trait = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
linkme = "0.3"
async-stream = "0.3"
futures-core = "0.3"
futures-util = "0.3"
cacheable = { version = "2.0.0", optional = true }
