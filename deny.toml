# cargo-deny 配置 —— 发布前 supply-chain 门禁(`cargo deny check`)。
# CI 里跑,拦已知漏洞 / 非法 license / 未知源。

[advisories]
version = 2
# RUSTSEC-2023-0071:`rsa` 0.9 的 Marvin 计时侧信道,目前【上游无修复版本】(no patched release)。
# 引入方 = `ncrypto`。默认构建只用该依赖做 RS256 公钥验签等不执行易受攻击私钥解密的操作；
# PKCS#1 v1.5 私钥解密与历史私钥运算受 `legacy-rsa-private` 编译 feature 和 Web 运行时风险门
# 双重隔离，不进入 `nasa/full`。因上游尚无可升级版本，仍需按包级 advisory 显式登记；
# 上游修复后删除本项并升级。
ignore = ["RUSTSEC-2023-0071"]

[licenses]
version = 2
# 允许的开源许可(本仓自身 = MIT OR Apache-2.0;其余为常见传递依赖许可)。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # 图片编解码传递依赖使用的伊利诺伊大学/NCSA 宽松许可。
    "NCSA",
    # 根证书数据集使用的社区数据许可,允许使用、复制与再分发。
    "CDLA-Permissive-2.0",
    # 高速哈希传递依赖使用的 Boost 宽松许可。
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
# 多版本共存只告警不拦(传递依赖难免);通配依赖告警。
multiple-versions = "warn"
wildcards = "warn"

[sources]
# 只信 crates.io;内部成员依赖同时声明 path 与 version,公开发布后解析到 crates.io。
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
