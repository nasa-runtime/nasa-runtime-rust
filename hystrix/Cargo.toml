# hystrix —— 熔断/隔离/监控运行时:Command/run_fn/Dashboard stream/配置驱动隔离 + re-export #[hystrix]
# 业务项目优先依赖 nasa 门面并开启 hystrix feature；内部迁移可直接依赖 hystrix 包。
[package]
name = "hystrix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "接口级隔离、超时、降级和 Dashboard 监控门面"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/hystrix"
readme = "README.md"


[lib]
name = "hystrix"
[dependencies]
hystrix-macro = { version = "1.0.1", path = "../hystrix-macro" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
matchit = "0.8"
dashmap = "6"
async-stream = "0.3"
tracing = "0.1"
# linkme:收集业务 crate 内唯一的 #[global_fallback] 终态处理入口
linkme = "0.3"
