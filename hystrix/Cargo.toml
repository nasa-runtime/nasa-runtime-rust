# hystrix —— 熔断/隔离/监控运行时:Command/run_fn/Dashboard stream/配置驱动隔离 + re-export #[hystrix]
# 业务项目优先依赖 nasa 门面并开启 hystrix feature；内部迁移可直接依赖 hystrix 包。
[package]
name = "hystrix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "熔断/隔离/Dashboard 监控门面(Command/run_fn/stream + #[hystrix])"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true


[lib]
name = "hystrix"
[dependencies]
hystrix-macro = { version = "1.0.0" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
matchit = "0.8"
dashmap = "6"
async-stream = "0.3"
tracing = "0.1"
