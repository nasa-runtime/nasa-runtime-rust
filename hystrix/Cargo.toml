# hystrix —— 隔离、超时、降级与周期观测；Command 可独立运行或由 Application 统一拥有。
# 业务项目优先依赖 nasa 门面并开启 hystrix feature。
[package]
name = "hystrix"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
description = "接口级隔离、超时、降级与 Dashboard 指标；支持 Application 受管命令目录和有序关闭"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["isolation", "timeout", "fallback", "lifecycle", "metrics"]
categories = ["asynchronous", "concurrency"]
documentation = "https://docs.rs/hystrix"
readme = "README.md"


[lib]
name = "hystrix"
[dependencies]
hystrix-macro = { version = "2.0.0" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
matchit = "0.8"
dashmap = "6"
async-stream = "0.3"
tracing = "0.1"
# linkme:收集业务 crate 内唯一的 #[global_fallback] 终态处理入口
linkme = "0.3"

tokio-util = { version = "0.7", features = ["rt"] }
