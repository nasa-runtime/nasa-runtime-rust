# ============================================================================
# nafka —— NASA Kafka 组件(实现 crate)
#
# 业务唯一入口是 nasa 门面（feature = "kafka" → nasa::kafka）；业务工程不应直接依赖本 crate。
#
# rdkafka 是 workspace 纯 Rust 惯例的显式例外：
#   - 默认从源码构建并静态链接 librdkafka，需要 C/C++ 编译工具链与 make；运行仍依赖目标系统 ABI;
#   - 默认不开 ssl,内网明文场景无 OpenSSL 面积;需要加密走 feature `tls`(内嵌静态 OpenSSL);
#   - rdkafka 类型不得出现在任何 pub API，全部收敛在内部 rd/ 模块。
# ============================================================================
[package]
name = "nafka"
version = "2.0.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["kafka", "transactions", "replay", "transfer", "messaging"]
categories = ["asynchronous", "network-programming"]
description = "Multi-source Kafka event runtime with ordered consumption, atomic consume-transform-produce, durable replay, recoverable cross-cluster transfer, and shared Java/Rust wire contracts"

[dependencies]
# tracing 是 rdkafka 的 optional 依赖生成的隐式 feature；
# 开启后 rust-rdkafka 自身事件走 tracing 而非 log，结构化字段仍由自定义 ClientContext 补充。
rdkafka = { version = "0.39", default-features = false, features = ["tokio", "libz-static", "tracing"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
tracing = "0.1"
futures = "0.3"
sha2 = "0.10"
# linkme 作为收集点宿主，#[kafka_consumer] 的静态注册项落在本 crate 的 distributed slice。
linkme = "0.3"
# ProtocolBytes 是与上游既有实现逐字节兼容的 wire codec。
naws-proto = { version = "2.0.0" }
natelemetry = { version = "2.0.0" }
nafka-macro = { path = "../nafka-macro", version = "2.0.3", optional = true }
async-trait = { version = "0.1", optional = true }
base64 = { version = "0.22", optional = true }
nasecret = { version = "2.0.0", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
zeroize = { version = "1", optional = true }
nametrics-core = { version = "2.0.0", optional = true }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql"], optional = true }
url = { version = "2", optional = true }

[target.'cfg(unix)'.dependencies]
# 本地 checkpoint 与 Java FileLock 使用相同的 POSIX 记录锁，不以 flock 冒充跨语言互斥。
rustix = { version = "1.1", features = ["fs"] }

[features]
default = ["macros"]
# 过程宏 #[kafka_consumer]；关闭后仍可使用 trait + register 显式注册。
macros = ["dep:nafka-macro"]
# SASL_SSL/SSL 场景内嵌静态 OpenSSL；仍需部署受信 CA 和相应认证材料。
tls = ["rdkafka/ssl-vendored"]
# Kerberos/GSSAPI 使用目标系统提供的 Cyrus SASL；避免静态 SASL 插件在
# librdkafka 构建阶段丢失目标系统的 GSS/Kerberos 链接依赖。
gssapi = ["tls", "rdkafka/gssapi"]
zstd = ["rdkafka/zstd"]
# Confluent-compatible Schema Registry adapter；保持显式 feature，并纳入门面的完整能力组合。
schema-registry = ["dep:async-trait", "dep:base64", "dep:nasecret", "dep:reqwest", "dep:zeroize"]
schema-registry-metrics = ["schema-registry", "dep:nametrics-core"]
# 单主 MySQL 共享 checkpoint，普通 Kafka 配置不引入 SQL 驱动。
mysql-checkpoint = ["dep:sqlx", "dep:url"]
