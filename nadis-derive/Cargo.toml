# nadis-derive：提供 #[derive(RedisDocument)] 派生宏。
# 宏只调用 nadis 的公开 API(DocMeta/FieldMeta/RedisDocument)，手写 impl 与派生 impl 共享同一运行时语义。
[package]
name = "nadis-derive"
version = "1.0.1"
edition.workspace = true
rust-version.workspace = true
description = "NASA RedisDocument 派生宏：RediSearch/RedisJSON 元数据与字段转换"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
proc-macro = true

name = "nadis_derive"
[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
# 运行时路径发现支持直接依赖 nadis、经 nasa::redis 门面使用以及 Cargo 依赖重命名。
nasa-macro-support = { package = "macro-support", version = "1.0.2" }
