[package]
name = "natx-pgsql"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Named ambient PostgreSQL transactions with managed datasource ownership and connection wait observability"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["postgresql", "transaction", "database", "observability", "async"]
categories = ["asynchronous", "database"]
readme = "README.md"

[dependencies]
natx-core = { version = "1.0.0" }
natx-macro = { package = "natx-macro", version = "1.0.1" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = { version = "1", features = ["sync", "rt", "time"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
log = "0.4"
