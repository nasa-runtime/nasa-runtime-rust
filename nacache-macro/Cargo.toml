# cache-macro —— Cacheable-lite 的属性过程宏 crate
# 提供 #[cached](读:两级缓存) 和 #[cache_invalidate](写:失效)
[package]
name = "nacache-macro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "#[cached]/#[cache_invalidate] 属性宏(两级缓存读写路径)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
proc-macro = true          # ★ 标记为过程宏 crate(只在编译期被调用,不进二进制)

name = "nacache_macro"
[dependencies]
nasa-macro-support = { package = "macro-support", version = "1.0.0", path = "../macro-support" }
syn = { version = "2", features = ["full"] }   # 解析被注解的 fn 的源码 token → 语法树
quote = "1"                                     # 用 quote!{} 把语法树/变量拼回 token(生成代码)
proc-macro2 = "1"                               # syn/quote 操作的 TokenStream 类型
