# ============================================================================
# async-macro —— 自定义属性宏 #[Async] / #[scheduled] / #[EnableScheduling](对标 原框架 @Async/@Scheduled/@EnableScheduling)
#   #[Async]            贴在 async fn 上(可带 owned 参数;属性本身无参):编译期改写成"调用即 tokio::spawn、返回 JoinHandle"。需有人调用。
#   #[scheduled]        贴在【零参 async fn】上:linkme 自动注册 + 调度。触发源 cron / fixed_rate / fixed_delay
#                       (各支持 _ms、数字+time_unit、_string;旧别名 every_ms/delay_ms)+ initial_delay + cron 的 zone
#                       + fixed_rate 限流 max_in_flight/skip_if_running;支持 repeatable。返回值忽略,标准 Result 的 Err 记通用日志。
#   #[EnableScheduling] 贴在 main 上(在 #[tokio::main] 之上):启动时拉起所有 #[scheduled]。#[EnableAsync] 为兼容别名。
#   收集靠 linkme;运行端在 scheduling crate(start_scheduled)。
# ============================================================================
[package]
name = "async-macro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "#[Async]/#[scheduled]/#[EnableScheduling] 属性宏(异步/定时)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
proc-macro = true

name = "async_macro"
[dependencies]
nasa-macro-support = { package = "macro-support", version = "1.0.0" }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
