# naml 只处理通用配置来源、分层合并、占位符和强类型反序列化。
# 远端配置由调用方作为内存 overlay 提供；本 crate 不连接配置中心，也不发布业务配置。
[package]
name = "naml"
version = "1.0.2"
edition.workspace = true
rust-version.workspace = true
description = "通用分层配置加载器，支持来源追踪、有界读取与可选精确文件 watcher"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["configuration", "yaml", "serde", "hot-reload", "overlay"]
categories = ["config", "development-tools"]

[lib]
name = "naml"

[features]
default = []
watch = ["dep:notify"]

[dependencies]
nabase = { package = "nabase", version = "1.0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 分层配置合并器：本地文件、profile、内存 overlay 与环境变量按叶子级深合并。
# 格式由 file_extension 决定：支持 yaml/json/toml，其它格式 fail-fast 而不猜测。
config = { version = "0.15", default-features = false, features = ["yaml", "json", "toml"] }
anyhow = "1"
tracing = "0.1"
notify = { version = "8.2", optional = true }
