# naws-proto-derive —— #[derive(ProtocolBytes)] 派生宏(原 proto-derive)。
# 消费方(naws-proto)用依赖别名保持 `use proto_derive::...` 不变。
[package]
name = "naws-proto-derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "#[derive(ProtocolBytes)] —— 从 proto 手写 codec 提炼的派生宏(VARINT_TLV + BITPACK_TLV)。"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
# 保持 crate 名 `proto_derive`(包内/历史源码同名引用)。
name = "naws_proto_derive"
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
