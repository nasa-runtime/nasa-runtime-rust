# naws-proto-derive —— `#[derive(ProtocolBytes)]` 派生宏，为 naws-proto 的 wire schema 生成 codec 调用。
[package]
name = "naws-proto-derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "#[derive(ProtocolBytes)] —— 从 proto 手写 codec 提炼的派生宏(VARINT_TLV + BITPACK_TLV)。"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
# Rust 库名与 package 统一映射为 `naws_proto_derive`。
name = "naws_proto_derive"
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
