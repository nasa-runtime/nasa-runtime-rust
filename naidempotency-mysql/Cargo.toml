[package]
name = "naidempotency-mysql"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
description = "NASA MySQL idempotency store with named natx datasource binding and durable response replay"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["mysql", "idempotency", "transaction", "database", "runtime"]
categories = ["database", "web-programming"]

[dependencies]
naidempotency = { version = "2.0.0" }
natx = { version = "2.0.0" }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "mysql"] }
async-trait = "0.1"
serde_json = "1"
