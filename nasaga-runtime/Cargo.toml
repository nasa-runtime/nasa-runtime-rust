[package]
name = "nasaga-runtime"
version = "1.0.2"
edition.workspace = true
rust-version.workspace = true
description = "Durable NASA Saga orchestration with named datasource binding, fencing, recovery and authenticated transports"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["saga", "workflow", "compensation", "microservices", "orchestration"]
categories = ["asynchronous", "database"]

[dependencies]
anyhow = "1"
# linkme 作为收集点宿主，#[saga] 的 descriptor 静态注册项落在本 crate 的 distributed slice。
linkme = "0.3"
# Saga 核心合同与 MySQL store 均固定使用公开坐标，避免运行时装载来源分裂的状态合同。
nasaga-core = { version = "1.0.1" }
nasaga-backend = { version = "1.0.0" }
nasaga-mysql = { version = "1.0.2" }
nasaga-runtime-core = { version = "1.0.0" }
nainbox-core = { version = "1.0.2" }
nainbox-mysql = { version = "1.0.2" }
naoutbox-core = { version = "1.0.2" }
naoutbox-mysql = { version = "1.0.2" }
# `TxDecision` 是提交结果不确定处理的必要合同。
natx = { version = "1.0.3" }
# 链路上下文共享类型:发起入口与 transport 收据显式传入 TraceContext,命令出站派生 child span。
natelemetry = { version = "1.0.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["mysql", "runtime-tokio"] }
# 调度批次业务键把对象身份收敛为有界十六进制摘要。
hex = "0.4"
uuid = { version = "1", features = ["v4", "v5"] }
tracing = "0.1"

[features]
default = []
# 真实 Kafka hosted transport：手动 ACK、分区退避、可信投递次数与 durability-first DLT。
kafka = ["nasaga-runtime-core/kafka"]
# 真实 Redis Streams hosted transport:XREADGROUP 显式循环、XAUTOCLAIM 重领、Lua 原子 DLT+XACK。
redis-stream = ["nasaga-runtime-core/redis-stream"]
# gRPC request/response transport：框架 generated service/client、mTLS 身份绑定与封闭收据。
grpc-transport = ["nasaga-runtime-core/grpc-transport"]
