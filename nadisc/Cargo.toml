# discovery —— 服务发现/注册的【provider-neutral 中性类型 + 接口】(后端 nacos/eureka/... 共用)。
# 放与后端无关的数据类型(Instance)、流量过滤规则(is_traffic_instance)与抽象接口
# (DiscoveryClient/ServiceRegistry 等):后端各自 crate 实现这些 trait,RestDiscovery 等上层只面向本 crate 抽象,
# 不绑定具体后端(NacosDiscoveryClient)。各后端 crate 彼此不互相依赖。
[package]
name = "nadisc"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
description = "中性服务发现、完整实例证据、注册所有权与传输提交合同"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["discovery", "microservices", "registry", "async"]
categories.workspace = true


[lib]
name = "nadisc"
[dependencies]
# 抽象接口需要:async trait(对象安全,供 dyn DiscoveryClient)、错误类型、watch::Receiver(服务实例快照推送)。
async-trait = "0.1"
anyhow = "1"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
serde = { version = "1", features = ["derive"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
serde_json = { version = "1", optional = true }

[features]
serde = ["dep:serde"]
http = ["serde", "dep:reqwest", "dep:serde_json"]
