name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  msrv:
    name: Rust 1.94 compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake libsasl2-dev libssl-dev pkg-config
      # 必须使用清单声明的最低 Rust 版本覆盖完整 feature 图。
      - run: cargo check --workspace --all-features

  nafka-policy:
    name: facade feature isolation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p nafka --no-default-features
      - run: cargo check -p nafka --features tls
      - run: cargo check -p nafka --features schema-registry
      - run: cargo check -p nasa --no-default-features
      - run: cargo check -p nasa --features ws
      - run: cargo check -p nasa --features ws-redis
      - run: cargo check -p nasa --features kafka
      - run: cargo check -p nasa --no-default-features --features application,kafka
      - run: cargo check -p nasa --features ws-kafka
      - run: cargo check -p nasa --features kafka-tls
      - run: cargo check -p nasa --features kafka-zstd
      - run: cargo check -p nasa --features kafka-schema-registry
      - run: cargo check -p nasa --features secret-http
      - run: cargo check -p nasa --features object-store-experimental
      - run: cargo check -p nasa --features grpc-experimental
      - run: cargo check -p nasa --features application,web,openapi
      # 默认密码构建不得隐式打开 legacy RSA 私钥路径；迁移 feature 另做隔离编译。
      - run: cargo check -p ncrypto --no-default-features
      - run: cargo check -p ncrypto --no-default-features --features legacy-rsa-private
      - run: cargo check -p nasa --no-default-features --features web-security
      - run: cargo check -p nasa --no-default-features --features web-security,web-crypto-legacy-rsa

  nafka-linux-builders:
    name: nafka ${{ matrix.arch }} builder
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake libsasl2-dev libssl-dev pkg-config
      # 第四批发布后 workspace 与 registry 同时存在同名 nafka；按 manifest 分开选择，避免 -p 把依赖来源误判为歧义。
      - run: cargo clippy --manifest-path nafka/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path naws/Cargo.toml --features kafka --all-targets -- -D warnings
      - run: cargo test --manifest-path nafka/Cargo.toml
      - run: cargo test --manifest-path naws/Cargo.toml --features kafka

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-test:
    name: clippy + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake libsasl2-dev libssl-dev pkg-config
      # 全 feature 下运行 clippy(-D warnings 由 RUSTFLAGS 生效),覆盖所有可选模块。
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo build --workspace --all-features
      # 产品工作区只执行随源码发布的目标与文档示例。
      - run: cargo test --workspace --all-features
      # 公开 API 文档是当前合同的一部分，缺失项和失效链接均阻止发布。
      - run: RUSTDOCFLAGS="-D missing_docs -D warnings" cargo doc --workspace --no-deps
      # 每个 .crate 归档都必须携带两份许可证正文和名称声明。
      - name: verify archive notices
        shell: bash
        run: |
          package_count="$(cargo metadata --no-deps --format-version 1 | jq '.packages | length')"
          archive_list="$(cargo package --workspace --list)"
          test "$(grep -Ec '^LICENSE-(MIT|APACHE)$' <<< "$archive_list")" -eq "$((package_count * 2))"
          test "$(grep -c '^NOTICE$' <<< "$archive_list")" -eq "$package_count"
      # 发布路径不得携带验证资产，组件源码、manifest 和随包文档也不得描述本地验证实现。
      - name: audit crate release boundary
        shell: bash
        run: |
          if cargo package --workspace --list | rg -ni '(^|/)[^/]*(test|fixture)[^/]*($|/)'; then
            exit 1
          fi
          if rg -ni '(cargo[[:space:]]+test|cfg\(test\)|#\[test\]|\btrybuild\b|\bfixture\b|测试|单测|测例|test target|compile test)' \
            --glob '!target/**' --glob '*/Cargo.toml' --glob '*/src/**' \
            --glob '*/README.md' --glob '*/*/README.md' .; then
            exit 1
          fi

  deny:
    name: cargo-deny (advisories / licenses / sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
