name: Publish crates.io batches

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "选择发布批次；后续批次只能在前置依赖已进入 crates.io 索引后执行"
        required: true
        type: choice
        options:
          - 1a
          - 1b
          - 2
          - 3
          - 3p
          - 4
          - 5
          - 6
      confirm:
        description: "常规批次输入 publish-1.0.0；3p 宏补丁输入 publish-1.0.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-io-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: release ref guard
    runs-on: ubuntu-24.04
    steps:
      - name: verify immutable release intent
        env:
          RELEASE_CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/release/1.0.0" ]]; then
            echo "仅允许从 release/1.0.0 发布，当前 ref: $GITHUB_REF" >&2
            exit 1
          fi
          expected_confirm="publish-1.0.0"
          if [[ "${{ inputs.batch }}" == "3p" ]]; then
            expected_confirm="publish-1.0.1"
          fi
          if [[ "$RELEASE_CONFIRM" != "$expected_confirm" ]]; then
            echo "确认文本不匹配，拒绝发布" >&2
            exit 1
          fi

  verify:
    name: verify ${{ inputs.batch }}
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@3a8b2ad3ea1212417907ff0e1b3d0c4e121bef40 # 1.94.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: select release crates
        env:
          RELEASE_BATCH: ${{ inputs.batch }}
        shell: bash
        run: |
          case "$RELEASE_BATCH" in
            1a)
              echo "RELEASE_CRATES=nabase macro-support nabudget nadisc naauthz naidempotency nainbox-core nametrics-core naopenapi naoutbox-core natelemetry" >> "$GITHUB_ENV"
              ;;
            1b)
              echo "RELEASE_CRATES=naml" >> "$GITHUB_ENV"
              ;;
            2)
              echo "RELEASE_CRATES=nadate nagrpc naimg namigrate nanum napart nasecret naws-proto-derive ncrypto rest-client-macro" >> "$GITHUB_ENV"
              ;;
            3)
              echo "RELEASE_CRATES=async-macro hystrix-macro naaudit nacache-macro nadis-derive nafana-macro nafka-macro nalog namapper-macro nanacos naobject napp-macro nasecret-http nasecret-vault natx-macro nauth-oauth naweb-macro naws-proto" >> "$GITHUB_ENV"
              ;;
            3p)
              echo "RELEASE_CRATES=hystrix-macro nafana-macro" >> "$GITHUB_ENV"
              ;;
            4)
              echo "RELEASE_CRATES=cacheable config-boot hystrix nadis nafana nafka natx naweb rest-discovery" >> "$GITHUB_ENV"
              ;;
            5)
              echo "RELEASE_CRATES=naidempotency-mysql naidempotency-redis nainbox-mysql namapper naoutbox-mysql nasched naws rest-discovery-nacos" >> "$GITHUB_ENV"
              ;;
            6)
              echo "RELEASE_CRATES=naaudit-mysql napp" >> "$GITHUB_ENV"
              ;;
            *)
              echo "未知发布批次: $RELEASE_BATCH" >&2
              exit 1
              ;;
          esac
      - name: verify nabase registry precondition
        if: inputs.batch == '1b'
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --user-agent "nasa-runtime-release/1.0" \
            "https://crates.io/api/v1/crates/nabase/1.0.0" >/dev/null
      - name: verify registry dependency policy
        env:
          RELEASE_BATCH: ${{ inputs.batch }}
        shell: bash
        run: |
          published_crates="macro-support nabase nabudget nadisc naauthz naidempotency nainbox-core nametrics-core naopenapi naoutbox-core natelemetry naml nadate nagrpc naimg namigrate nanum napart nasecret naws-proto-derive ncrypto rest-client-macro async-macro hystrix-macro naaudit nacache-macro nadis-derive nafana-macro nafka-macro nalog namapper-macro nanacos naobject napp-macro nasecret-http nasecret-vault natx-macro nauth-oauth naweb-macro naws-proto cacheable config-boot hystrix nadis nafana nafka natx naweb rest-discovery naidempotency-mysql naidempotency-redis nainbox-mysql namapper naoutbox-mysql nasched naws rest-discovery-nacos"
          failed=false
          while IFS=$'\t' read -r owner dependency dependency_path; do
            case " $published_crates " in
              *" $dependency "*)
                if [[ "$RELEASE_BATCH" == "3p" && ( "$dependency" == "hystrix-macro" || "$dependency" == "nafana-macro" ) ]]; then
                  echo "$owner 临时通过 path 验证尚未发布的 $dependency 1.0.1；3p 发布后第四批必须移除"
                  continue
                fi
                echo "$owner 仍通过 path 引用已发布 crate $dependency: $dependency_path" >&2
                failed=true
                ;;
            esac
          done < <(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -r '.packages[] as $owner | $owner.dependencies[] | select(.path != null) | [$owner.name, .name, .path] | @tsv'
          )
          if [[ "$failed" == "true" ]]; then
            exit 1
          fi

          for crate_name in $RELEASE_CRATES; do
            local_dependencies="$(
              cargo metadata --locked --no-deps --format-version 1 |
                jq -r --arg name "$crate_name" '.packages[] | select(.name == $name) | .dependencies[] | select(.path != null) | "\(.name)=\(.path)"'
            )"
            if [[ -n "$local_dependencies" ]]; then
              echo "$crate_name 发布 manifest 仍含本地依赖:" >&2
              echo "$local_dependencies" >&2
              exit 1
            fi
          done
      - name: verify formatting
        run: cargo fmt --all -- --check
      - name: verify clippy
        shell: bash
        run: |
          for crate_name in $RELEASE_CRATES; do
            cargo clippy --locked -p "$crate_name" --all-targets --all-features -- -D warnings
          done
      - name: verify rustdoc
        shell: bash
        run: |
          for crate_name in $RELEASE_CRATES; do
            RUSTDOCFLAGS="-D missing_docs -D warnings" \
              cargo doc --locked --no-deps --all-features -p "$crate_name"
          done
      - name: verify package archives
        shell: bash
        run: |
          scan_root="$RUNNER_TEMP/crate-scan"
          mkdir -p "$scan_root"
          for crate_name in $RELEASE_CRATES; do
            cargo package --locked -p "$crate_name"
            version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r --arg name "$crate_name" '.packages[] | select(.name == $name) | .version')"
            expected_version="1.0.0"
            if [[ "${{ inputs.batch }}" == "3p" ]]; then
              expected_version="1.0.1"
            fi
            if [[ "$version" != "$expected_version" ]]; then
              echo "$crate_name 版本不是 $expected_version: $version" >&2
              exit 1
            fi
            archive="target/package/${crate_name}-${version}.crate"
            if [[ ! -f "$archive" ]]; then
              echo "未生成归档: $archive" >&2
              exit 1
            fi
            archive_list="$scan_root/${crate_name}.files"
            tar -tzf "$archive" > "$archive_list"
            for required_file in README.md LICENSE-MIT LICENSE-APACHE NOTICE; do
              if ! grep -Eq "/${required_file}$" "$archive_list"; then
                echo "$crate_name 归档缺少 $required_file" >&2
                exit 1
              fi
            done
            if grep -Eni '(^|/)[^/]*(test|fixture)[^/]*($|/)' "$archive_list"; then
              echo "$crate_name 归档包含验证资产路径" >&2
              exit 1
            fi
            crate_scan_dir="$scan_root/$crate_name"
            mkdir -p "$crate_scan_dir"
            tar -xzf "$archive" -C "$crate_scan_dir"
            if grep -REni --binary-files=without-match '(cargo[[:space:]]+test|cfg\(test\)|#\[test\]|(^|[^[:alnum:]_])tests?/|(^|[^[:alnum:]_])trybuild([^[:alnum:]_]|$)|(^|[^[:alnum:]_])fixture([^[:alnum:]_]|$)|测试|单测|测例|test target|compile test)' "$crate_scan_dir"; then
              echo "$crate_name 归档包含验证性内容" >&2
              exit 1
            fi
          done

  publish:
    name: publish ${{ inputs.batch }}
    needs: verify
    runs-on: ubuntu-24.04
    environment: crates-io
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@3a8b2ad3ea1212417907ff0e1b3d0c4e121bef40 # 1.94.0
      - name: select release crates
        env:
          RELEASE_BATCH: ${{ inputs.batch }}
        shell: bash
        run: |
          case "$RELEASE_BATCH" in
            1a)
              echo "RELEASE_CRATES=nabase macro-support nabudget nadisc naauthz naidempotency nainbox-core nametrics-core naopenapi naoutbox-core natelemetry" >> "$GITHUB_ENV"
              ;;
            1b)
              echo "RELEASE_CRATES=naml" >> "$GITHUB_ENV"
              ;;
            2)
              echo "RELEASE_CRATES=nadate nagrpc naimg namigrate nanum napart nasecret naws-proto-derive ncrypto rest-client-macro" >> "$GITHUB_ENV"
              ;;
            3)
              echo "RELEASE_CRATES=async-macro hystrix-macro naaudit nacache-macro nadis-derive nafana-macro nafka-macro nalog namapper-macro nanacos naobject napp-macro nasecret-http nasecret-vault natx-macro nauth-oauth naweb-macro naws-proto" >> "$GITHUB_ENV"
              ;;
            3p)
              echo "RELEASE_CRATES=hystrix-macro nafana-macro" >> "$GITHUB_ENV"
              ;;
            4)
              echo "RELEASE_CRATES=cacheable config-boot hystrix nadis nafana nafka natx naweb rest-discovery" >> "$GITHUB_ENV"
              ;;
            5)
              echo "RELEASE_CRATES=naidempotency-mysql naidempotency-redis nainbox-mysql namapper naoutbox-mysql nasched naws rest-discovery-nacos" >> "$GITHUB_ENV"
              ;;
            6)
              echo "RELEASE_CRATES=naaudit-mysql napp" >> "$GITHUB_ENV"
              ;;
            *)
              echo "未知发布批次: $RELEASE_BATCH" >&2
              exit 1
              ;;
          esac
      - name: publish crates sequentially
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "crates.io token 未配置" >&2
            exit 1
          fi

          # 业务作用: 在归档 checksum 因发布工作流提交变化而不同时，验证 crates.io 已有版本与当前候选的实际发布内容等价。
          # 参数说明: 依次接收 crate 名、版本、本地归档路径和 crates.io API 返回的远端 checksum。
          # 返回: 远端归档完整且除 VCS 提交号外逐文件一致时成功；任何业务内容或元数据差异均失败。
          verify_existing_archive() {
            local crate_name="$1"
            local version="$2"
            local local_archive="$3"
            local expected_remote_checksum="$4"
            local compare_root
            compare_root="$(mktemp -d "$RUNNER_TEMP/archive-compare-${crate_name}-${version}.XXXXXX")"
            local remote_archive="$compare_root/remote.crate"
            local local_dir="$compare_root/local"
            local remote_dir="$compare_root/remote"
            local crate_root="${crate_name}-${version}"
            local actual_remote_checksum
            local local_vcs
            local remote_vcs

            if [[ -z "$expected_remote_checksum" ]]; then
              echo "$crate_name $version 远端 checksum 为空" >&2
              return 1
            fi
            mkdir -p "$local_dir" "$remote_dir"
            curl --fail --silent --show-error --location \
              --user-agent "nasa-runtime-release/1.0" \
              --output "$remote_archive" \
              "https://crates.io/api/v1/crates/${crate_name}/${version}/download"
            actual_remote_checksum="$(sha256sum "$remote_archive" | awk '{print $1}')"
            if [[ "$actual_remote_checksum" != "$expected_remote_checksum" ]]; then
              echo "$crate_name $version 下载归档与 crates.io checksum 不一致" >&2
              return 1
            fi

            tar -xzf "$local_archive" -C "$local_dir"
            tar -xzf "$remote_archive" -C "$remote_dir"
            local_vcs="$local_dir/$crate_root/.cargo_vcs_info.json"
            remote_vcs="$remote_dir/$crate_root/.cargo_vcs_info.json"
            if [[ ! -f "$local_vcs" || ! -f "$remote_vcs" ]]; then
              echo "$crate_name $version 缺少 VCS 来源元数据" >&2
              return 1
            fi

            # 工作流修复会改变 git.sha1，但不得改变 path_in_vcs 或任何真正进入 crate 的发布内容。
            jq -S '.git.sha1 = "<release-commit>"' "$local_vcs" > "$compare_root/local-vcs.json"
            jq -S '.git.sha1 = "<release-commit>"' "$remote_vcs" > "$compare_root/remote-vcs.json"
            if ! diff -u "$compare_root/local-vcs.json" "$compare_root/remote-vcs.json"; then
              echo "$crate_name $version VCS 来源元数据不等价" >&2
              return 1
            fi
            if ! diff -ru --exclude='.cargo_vcs_info.json' "$local_dir" "$remote_dir"; then
              echo "$crate_name $version 已存在但发布内容不等价" >&2
              return 1
            fi
          }

          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          for crate_name in $RELEASE_CRATES; do
            version="$(printf '%s' "$metadata" | jq -r --arg name "$crate_name" '.packages[] | select(.name == $name) | .version')"
            expected_version="1.0.0"
            if [[ "${{ inputs.batch }}" == "3p" ]]; then
              expected_version="1.0.1"
            fi
            if [[ "$version" != "$expected_version" ]]; then
              echo "$crate_name 版本不是 $expected_version: $version" >&2
              exit 1
            fi

            cargo package --locked -p "$crate_name"
            archive="target/package/${crate_name}-${version}.crate"
            local_checksum="$(sha256sum "$archive" | awk '{print $1}')"
            response_file="$RUNNER_TEMP/${crate_name}-${version}.json"
            version_url="https://crates.io/api/v1/crates/${crate_name}/${version}"
            http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --user-agent "nasa-runtime-release/1.0" "$version_url")"

            case "$http_code" in
              200)
                remote_checksum="$(jq -r '.version.checksum // empty' "$response_file")"
                if [[ "$remote_checksum" == "$local_checksum" ]]; then
                  echo "$crate_name $version 已发布且 checksum 一致，安全跳过"
                else
                  verify_existing_archive "$crate_name" "$version" "$archive" "$remote_checksum"
                  echo "$crate_name $version 已发布且内容等价，安全跳过"
                fi
                continue
                ;;
              404)
                ;;
              *)
                echo "查询 $crate_name $version 返回 HTTP $http_code" >&2
                cat "$response_file" >&2
                exit 1
                ;;
            esac

            publish_log="$RUNNER_TEMP/${crate_name}-${version}.publish.log"
            publish_attempt=1
            while true; do
              if (( publish_attempt > 1 )); then
                http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
                  --user-agent "nasa-runtime-release/1.0" "$version_url")"
                if [[ "$http_code" == "200" ]]; then
                  remote_checksum="$(jq -r '.version.checksum // empty' "$response_file")"
                  if [[ "$remote_checksum" != "$local_checksum" ]]; then
                    verify_existing_archive "$crate_name" "$version" "$archive" "$remote_checksum"
                  fi
                  break
                fi
                if [[ "$http_code" != "404" ]]; then
                  echo "重试发布前查询 $crate_name $version 返回 HTTP $http_code" >&2
                  cat "$response_file" >&2
                  exit 1
                fi
              fi

              set +e
              cargo publish --locked -p "$crate_name" 2>&1 | tee "$publish_log"
              publish_status="${PIPESTATUS[0]}"
              set -e
              if [[ "$publish_status" == "0" ]]; then
                break
              fi
              if ! grep -q 'status 429 Too Many Requests' "$publish_log"; then
                exit "$publish_status"
              fi
              if (( publish_attempt >= 3 )); then
                echo "$crate_name 连续触发 crates.io 发布限流，停止自动重试" >&2
                exit "$publish_status"
              fi

              retry_delay=660
              retry_at="$(sed -nE 's/.*Please try again after (.+ GMT) and see.*/\1/p' "$publish_log" | tail -n 1)"
              if [[ -n "$retry_at" ]]; then
                retry_epoch="$(date -u -d "$retry_at" +%s 2>/dev/null || true)"
                if [[ "$retry_epoch" =~ ^[0-9]+$ ]]; then
                  now_epoch="$(date -u +%s)"
                  retry_delay=$((retry_epoch - now_epoch + 15))
                  if (( retry_delay < 15 )); then
                    retry_delay=15
                  fi
                fi
              fi

              # crates.io 对短时间创建多个新 crate 实施冷却；等待服务端窗口恢复，避免无效重试扩大限流。
              echo "$crate_name 触发 crates.io 限流，${retry_delay} 秒后重试"
              sleep "$retry_delay"
              publish_attempt=$((publish_attempt + 1))
            done

            published=false
            for _ in {1..30}; do
              http_code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
                --user-agent "nasa-runtime-release/1.0" "$version_url")"
              if [[ "$http_code" == "200" ]]; then
                published=true
                break
              fi
              if [[ "$http_code" != "404" ]]; then
                echo "等待 $crate_name $version 入库时返回 HTTP $http_code" >&2
                cat "$response_file" >&2
                exit 1
              fi
              sleep 10
            done
            if [[ "$published" != "true" ]]; then
              echo "$crate_name $version 上传后五分钟仍未出现在 API" >&2
              exit 1
            fi
            remote_checksum="$(jq -r '.version.checksum // empty' "$response_file")"
            if [[ -z "$remote_checksum" || "$remote_checksum" != "$local_checksum" ]]; then
              echo "$crate_name $version 发布后 checksum 不匹配" >&2
              exit 1
            fi
          done
