# base：公共 API 与基础工具库，提供响应壳、日期时间、容量、ID、字符串、环境变量和翻译抽象。
# 业务通过 `nasa` 的 `base` feature 一次引入本 crate 的完整能力集合。
[package]
name = "nabase"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
description = "NASA base APIs and utilities for responses, date-time, sizes, IDs, strings, environment values, and translation"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["backend", "datetime", "utilities", "response"]
categories = ["date-and-time", "config", "web-programming"]

[lib]
name = "nabase"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
