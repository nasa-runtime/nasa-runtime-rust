# napart —— 命名隔离、严格 FIFO，并通过盗洞完成保序任务窃取的分区执行器。
# 每个 Runner 独立拥有 generation、slot 主 MPSC、类型状态、盗洞、定时器、预算与停机权威。
# 严格任务跨 stock/incremental/staging 保持同一受理序号；非严格任务使用多目标租约盗洞。
# 独立依赖：napart = "1.1.2"；兼容入口为 napart::PartitionExecutor。
[package]
name = "napart"
version = "1.1.2"
edition.workspace = true
rust-version.workspace = true
description = "命名隔离、严格 FIFO 的保序任务窃取分区执行器（有界背压、可证明停机）"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["async", "executor", "partition", "work-stealing", "fifo"]
categories = ["asynchronous", "concurrency"]
readme = "README.md"
documentation = "https://docs.rs/napart"


[lib]
name = "napart"
[dependencies]
# Tokio 提供监督任务、容量许可、唤醒与单调定时器。
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
# 类型状态注册表按 key 分片，已存在类型的提交不经过 slot 级全表互斥锁。
dashmap = "6"
# 业务 Future 的 poll 展开在单任务边界转换为稳定失败终态。
futures-util = "0.3"
# 序号 MPSC 的热 tail 使用原子 Arc 快照。
arc-swap = "1"
