# napart —— 带保序任务窃取的分 lane 串行/并行执行器。
# 顺序边界是「分区 + 任务类型」:严格类型同分区按提交顺序串行,非严格类型跨分区并发;
# 空闲分区经执行权 CAS 接管热点严格 lane(不搬数据,FIFO 由队列保证)。
# 兼容入口保持同 key 严格 FIFO、有界背压与被拒可见;显式停机提供退出证明和损耗报告。
# 独立发布入口:napart = "1.1";use napart::PartitionExecutor。
[package]
name = "napart"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
description = "带保序任务窃取的 NASA 分 lane 执行器（严格 FIFO、类型化并发、有界背压、可审计停机）"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["async", "executor", "partition", "work-stealing", "fifo"]
categories = ["asynchronous", "concurrency"]
readme = "README.md"
documentation = "https://docs.rs/napart"


[lib]
name = "napart"
[dependencies]
# 仅依赖 tokio 运行时原语(spawn/mpsc/watch/JoinHandle/time)+ tracing 日志, 无重依赖。
# macros: tokio::select! 需要(worker 循环里用到)。
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
# MPMC 队列:严格 lane 靠门禁把消费者串行化为一个,非严格 lane 直接多消费者并发。
crossbeam-queue = "0.3"
# lane 注册表的无锁读快照(写侧串行创建、读侧 load 即最新)。
arc-swap = "1"
