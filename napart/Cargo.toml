# partition —— 同 key 串行消费执行器(从 原实现 TimingWheel.partition 移植,生产硬化版)。
# 语义:同 key 严格按提交顺序串行、不同 key 最大并发;不丢任务的优雅停机;
#       任务 panic 隔离 + worker 死亡检测/黑洞拒收/健康面板。
# 业务经 nasa 门面引用:nasa = { features = ["partition"] };  use nasa::partition::PartitionExecutor;
# (注:crate 名 partition 与 nasa-redis 内部的 partition 模块不冲突——后者是 nasa::redis::partition 模块,本 crate 是独立 crate→nasa::partition。)
[package]
name = "napart"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "NASA 同 key 串行消费执行器(对照原分区执行器;不丢任务优雅停机 + 黑洞防护)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true


[lib]
name = "napart"
[dependencies]
# 仅依赖 tokio 运行时原语(spawn/mpsc/watch/JoinHandle/time)+ tracing 日志, 无重依赖。
# macros: tokio::select! 需要(worker 循环里用到)。
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
