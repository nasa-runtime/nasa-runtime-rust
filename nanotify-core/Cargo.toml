[package]
name = "nanotify-core"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Optional business-initialized notifications with bounded non-blocking queues and atomic delivery metrics"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["notification", "observability", "async", "bounded"]
categories = ["asynchronous"]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
nametrics-core = { version = "2.0.0" }
tokio = { version = "1", features = ["sync"] }
