# naimg —— 图片压缩/缩放 crate(对照 原实现 原工具包 ImageUtils)。
# 组件设计与兼容边界见 README.md。
#
# 本 crate 依赖 crates.io 的 image crate；为区分公开包 `naimg` 与底层 codec，依赖名固定为
# `image_crate`(package = "image")。公开 API 只暴露本组件声明支持的格式与压缩边界。
[package]
name = "naimg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "NASA 图片压缩/缩放工具(对照原工具包 ImageUtils):质量+尺寸压缩,基于 image crate"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true


[lib]
name = "naimg"
[dependencies]
# 只编入组件承诺的常用格式，避免默认格式集把未对外承诺的 AVIF 编码链及其停止维护依赖
# 带进所有图片用户。格式边界在 README 明示；需要其它格式应由业务在边界层转换。
image_crate = { package = "image", version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
    "webp",
] }
