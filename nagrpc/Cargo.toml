[package]
name = "nagrpc"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Managed gRPC listeners and discovery clients with HTTP/2 admission, TLS, bounded streams, and shutdown"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["grpc", "tonic", "discovery", "lifecycle", "async"]
categories = ["asynchronous", "network-programming"]

[features]
default = []
discovery = ["dep:nadisc-runtime", "dep:nadisc", "dep:tower-service", "dep:http-body-util", "dep:futures-util"]

[dependencies]
nadisc-runtime = { path = "../nadisc-runtime", version = "1.0.0", optional = true }
nadisc = { path = "../nadisc", version = "2.0.0", optional = true }
tower-service = { version = "0.3", optional = true }
http-body-util = { version = "0.1", optional = true }
futures-util = { version = "0.3", optional = true }
nabudget = { version = "2.0.0" }
bytes = "1"
http-body = "1"
hyper = { version = "1", features = ["http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
prost = "0.14"
prost-types = "0.14"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-reflection = "0.14"
tracing = "0.1"
x509-parser = "0.18"
zeroize = "1"
