[package]
name = "nagrpc"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Managed gRPC service registry, HTTP/2 and TLS boundaries, observability, and bounded listener lifecycle"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["grpc", "tonic", "server", "lifecycle", "async"]
categories = ["asynchronous", "network-programming"]

[dependencies]
bytes = "1"
http-body = "1"
hyper = { version = "1", features = ["http2", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
prost = "0.14"
prost-types = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-reflection = "0.14"
tracing = "0.1"
x509-parser = "0.18"
zeroize = "1"
