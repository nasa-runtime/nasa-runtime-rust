[package]
name = "naoutbox-pgsql"
version = "2.0.1"
edition.workspace = true
rust-version.workspace = true
description = "PostgreSQL transactional Outbox with fenced dispatch ownership, SKIP LOCKED polling, quotas, lanes, and retention"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["postgresql", "outbox", "transaction", "messaging"]
categories = ["database", "asynchronous"]
readme = "README.md"

[dependencies]
async-trait = "0.1"
naoutbox-core = { version = "2.0.1" }
natx-pgsql = { version = "2.0.1" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = { version = "1.54.1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }
