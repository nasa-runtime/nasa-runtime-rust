# rest-discovery —— 带服务发现与客户端负载均衡的 HTTP 客户端。
#
# 只面向 `discovery::DiscoveryClient` 抽象做客户端负载均衡 + URL 重写;**绝不依赖 nacos crate**
# (换 eureka/consul 时本 crate 不动)。后端由调用方在 main 里 connect 后装成 `Arc<dyn DiscoveryClient>` 注入。
#
# 三档识别(lb.md「实现基准 §A」):
#   档1 service_request(service, method, path) / OpenFeign service=  → 显式内部直连
#   档2 lb://service/path                                            → 显式内部直连
#   档3 http(s)://host/path  → 默认普通外部 HTTP;`heuristic_http=Enabled` 时命中服务名索引(ServiceNameIndex)才走 LB(已实现)
[package]
name = "rest-discovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "带服务发现 + 客户端负载均衡的 HTTP client(面向 discovery::DiscoveryClient 抽象;对标 @LoadBalanced RestTemplate)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true


[lib]
name = "rest_discovery"
[features]
default = []
# 可选真实后端开关:默认不启用,普通构建只保留 provider-neutral 依赖图。
live-nacos = ["dep:nanacos", "nanacos/nacos"]

[dependencies]
# 只依赖 provider-neutral 抽象(Instance / DiscoveryClient / is_traffic_instance / WatchOptions / ServiceWatch)。
nadisc = { package = "nadisc", version = "1.0.0", path = "../nadisc" }
nabudget = { version = "1.0.0", path = "../nabudget" }
natelemetry = { version = "1.0.0", path = "../natelemetry" }
# 已核实:workspace 树里 reqwest 0.12 走 rustls(从不 native-tls/openssl)。关 default-tls,只挂 rustls。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
anyhow = "1"
thiserror = "1"
dashmap = "6"
arc-swap = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tracing = "0.1"
# 声明式客户端(rest-client-macro)展开需要:async_trait(经 __private 桥接给生成的 impl)、
# bytes(send_bytes 返回)、percent-encoding(PathVariable 路径段编码)。
async-trait = "0.1"
bytes = "1"
percent-encoding = "2"
httpdate = "1"
# live-nacos 才编入:真 Nacos 后端(可选,不进默认依赖图)。
nanacos = { package = "nanacos", version = "1.0.0", path = "../nanacos", optional = true, default-features = false }
