# 事务属性宏在编译期选择 typed runtime，嵌套调用仍受同源事务与模式约束。
[package]
name = "natx-macro"
version = "2.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Compile-time MySQL, PostgreSQL and SQLite ambient transaction attribute macros"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["macro", "transaction", "mysql", "postgresql", "sqlite"]
categories = ["asynchronous", "database"]

[lib]
proc-macro = true

name = "natx_macro"
[dependencies]
nasa-macro-support = { package = "macro-support", version = "2.0.1" }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
