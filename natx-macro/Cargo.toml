# ============================================================================
# tx-macro —— 自定义属性宏 #[transactional](ambient 事务编排)
#   把被注解的 async fn 包进 crate::tx::run(...):进方法 begin、正常 commit、出错 rollback。
#   配合 src/tx.rs 的 task_local ambient 事务:方法体里嵌套调用的 repo 自动加入同一事务,无需手传连接。
# ============================================================================
[package]
name = "natx-macro"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Compile-time MySQL and PostgreSQL ambient transaction attribute macros"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["macro", "transaction", "mysql", "postgresql", "async"]
categories = ["asynchronous", "database"]

[lib]
proc-macro = true

name = "natx_macro"
[dependencies]
nasa-macro-support = { package = "macro-support", version = "2.0.0" }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
