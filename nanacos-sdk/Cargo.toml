[package]
name = "nanacos-sdk"
version = "1.0.0"
edition = "2024"
rust-version.workspace = true
autotests = false
autoexamples = false
authors = ["nacos-group", "CheirshCai <785427346@qq.com>", "onewe <2583021406@qq.com>"]
license = "Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/nanacos-sdk"
repository.workspace = true
homepage = "https://nacos.io"
description = "Nacos SDK compatibility transport with connection invalidation and identity-preserving reconnect"
categories = ["network-programming", "development-tools"]
keywords = ["microservices", "config", "naming", "service-discovery", "config-management"]
include = ["/Cargo.toml", "/src/**", "/README.md", "/LICENSE", "/NOTICE", "/.clippy.toml"]

[lib]
name = "nacos_sdk"

[lints.rust]
# 保留可选覆盖工具的条件编译识别，避免消费者出现未知 cfg 告警。
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }

[features]
default = ["config", "naming", "auth-by-http"]
config = []
naming = []
tls = [
    "reqwest/default-tls",
    "tonic/tls-ring",
    "tonic/tls-native-roots",
]
auth-by-http = []
auth-by-aliyun = ["ring", "base64", "chrono"]
# 未自行安装 tracing subscriber 的宿主可启用此入口。
tracing-log = ["tracing-subscriber", "tracing-appender"]

[dependencies]
nacos-macro = { version = "0.3.0" }

arc-swap = "1.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "fs"] }

futures = { version = "0.3", default-features = false, features = ["async-await", "std"] }
futures-util = "0.3"
async-trait = "0.1"
async-stream = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"], optional = true }
tracing-appender = { version = "0.2", optional = true }

local_ipaddress = "0.1.3"
rand = "0.10"

reqwest = { version = "0.12", default-features = false, features = [] }
url = "2"

# 阿里云 RAM 身份认证需要签名与时间编码。
ring = { version = "0.17", default-features = false, optional = true }
base64 = { version = "0.22", default-features = false, optional = true }
chrono = { version = "0.4", default-features = false, features = ["now"], optional = true }

prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14"
tower = { version = "0.5", features = ["buffer", "util"] }

want = "0.3"
dashmap = "6.1"

dotenvy = "0.15"
