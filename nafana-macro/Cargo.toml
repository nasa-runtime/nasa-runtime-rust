# nafana-macro —— 自定义【属性过程宏】#[grafana(...)] 的独立 crate
# 编译期校验参数、提取 mapping path，并生成 nafana Command 包装代码。
[package]
name = "nafana-macro"
version = "1.0.1"
edition.workspace = true
rust-version.workspace = true
description = "#[grafana] 接口保护与 #[global_fallback] 终态降级属性宏"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
# 过程宏 crate:编译成编译器插件,只在编译期被调用,不进最终二进制。
proc-macro = true

name = "nafana_macro"
[dependencies]
nasa-macro-support = { package = "macro-support", version = "1.0.1" }
# syn: 解析被注解函数与注解参数(features=full 才能解析函数体)
syn = { version = "2", features = ["full"] }
# quote: 用 quote!{} 模板把 AST/变量拼回 TokenStream
quote = "1"
# proc-macro2: 可在普通代码里操作的 TokenStream 类型(互斥指纹检测要递归遍历它)
proc-macro2 = "1"
# serde_json: 仅编译期校验 reject_response/timeout_response 是合法 JSON;不进运行期二进制
serde_json = "1"
