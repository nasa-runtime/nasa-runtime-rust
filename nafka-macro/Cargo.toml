[package]
name = "nafka-macro"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["kafka", "consumer", "macros", "messaging", "async"]
categories.workspace = true
description = "Kafka 消费者属性宏：类型化路由、共同身份门禁、确认模式与静态 descriptor 收集"

[lib]
proc-macro = true
name = "nafka_macro"

[dependencies]
nasa-macro-support = { package = "macro-support", version = "2.0.0" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
