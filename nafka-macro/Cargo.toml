[package]
name = "nafka-macro"
version = "1.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "NASA Kafka 消费者属性宏：编译期签名校验与静态 descriptor 收集"

[lib]
proc-macro = true
name = "nafka_macro"

[dependencies]
nasa-macro-support = { package = "macro-support", version = "1.0.2" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
