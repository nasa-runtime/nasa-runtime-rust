# naws-proto —— NASA wire schema 与有界编解码实现。
[package]
name = "naws-proto"
version = "1.0.1"
edition.workspace = true
rust-version.workspace = true
description = "NASA 长连接 wire codec：VARINT_TLV、BITPACK_TLV 与 JSON_BYTES"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
# crate 名固定为 `naws_proto`，外部消费方也可以按需要设置依赖别名。
name = "naws_proto"
path = "src/lib.rs"

# VARINT/BITPACK 编解码显式控制 tag、wire type、长度和字段顺序，维持稳定线协议。
# JSON_BYTES 模式通过 serde 属性控制字段名称、缺省值和字节数组表示。
[dependencies]
naws-proto-derive = { package = "naws-proto-derive", version = "1.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
