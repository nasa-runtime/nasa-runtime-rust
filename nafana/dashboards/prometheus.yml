# nafana 应用指标的 Prometheus 抓取配置。
#
# 接入步骤：
# 1. 将此抓取任务加入现有 Prometheus 配置，或直接使用此文件启动独立实例。
# 2. 将 target 的 host:port 改为 Prometheus 可以访问的应用地址。
# 3. 应用使用根路径 /metrics 暴露指标时，保留 job_name 和 metrics_path。
#
# 此示例假定 Prometheus 运行于 Docker，两个独立应用进程分别监听宿主机的 8080 和 8081。
# Prometheus 直接运行于宿主机时，应改用 127.0.0.1，并保留对应应用端口。
# Linux Docker 环境可能需要以下 compose 配置，使容器能够解析宿主机地址：
# extra_hosts: ["host.docker.internal:host-gateway"]

global:
  # Dashboard 使用 10s increase/rate 窗口；抓取间隔必须不大于 5s，确保窗口内至少有两个样本。
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "example-service"
    # 不要调大到 10s 以上，否则 Dashboard 的 10s 查询会间歇性显示空值。
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: "/metrics"
    scheme: "http"

    static_configs:
      - targets:
          # 各应用实例分别配置可达的 host:port；此列表决定实际抓取目标。
          - "host.docker.internal:8080"
          - "host.docker.internal:8081"
        labels:
          name: "nafana-app"
          env: "local"

      # 新增应用进程时将地址加入同一目标列表。
      # Prometheus 按抓取地址生成 instance 标签；Dashboard 汇总所选实例的指标。
