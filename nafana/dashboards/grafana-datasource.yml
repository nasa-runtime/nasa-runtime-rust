# Grafana provisioning 使用的 Prometheus 数据源配置，供 nafana Dashboard 查询指标。
#
# 保留 name 和 uid，使 nafana-interfaces.json 中的数据源引用能够匹配此配置。
# Grafana 无法解析 Docker 服务名 prometheus 时，将 url 的 host:port 改为
# Grafana 服务端可以访问的 Prometheus 地址；浏览器可达并不等于服务端可达。

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 5s
      httpMethod: POST
