[package]
name = "nasaga-runtime-core"
version = "2.0.1"
edition.workspace = true
rust-version.workspace = true
description = "Backend-neutral durable Saga state machine with continuously authorized result recovery"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["saga", "workflow", "runtime", "observability", "microservices"]
categories = ["asynchronous"]
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "NOTICE",
    "build.rs",
    "src/**",
    "proto/saga_transport.proto",
    "proto/saga_orchestrator.proto",
]

[dependencies]
anyhow = "1"
async-trait = "0.1"
linkme = "0.3"
nasaga-backend = { version = "2.0.0" }
nasaga-core = { version = "2.0.0" }
nainbox-core = { version = "2.0.0" }
naoutbox-core = { version = "2.0.0" }
natelemetry = { version = "2.0.0" }
natx-core = { version = "2.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "v5"] }
tracing = "0.1"
hmac = "0.12"
url = "2"
nafka = { version = "2.0.0", optional = true, default-features = false }
nadis = { version = "2.0.0", optional = true }
redis = { version = "1", optional = true, features = ["tokio-comp", "script", "connection-manager", "cluster-async"] }
tokio = { version = "1", optional = true, features = ["time"] }
nagrpc = { version = "2.0.0", optional = true }

[build-dependencies]
nagrpc-build = { version = "2.0.0" }

[features]
default = []
kafka = ["dep:nafka"]
redis-stream = ["dep:nadis", "dep:redis", "dep:tokio"]
grpc-transport = ["dep:nagrpc"]
