# nadis：对齐既有工具包、cache 与 Redis 五件套公开语义的基础层。
# 本 crate 提供 client、commands、codec、keytag、显式 PipelineSession、分布式锁、
# partition、search 与 leader 能力；业务项目应经 nasa 门面的 `redis` feature 引用。
[package]
name = "nadis"
version = "1.0.2"
edition.workspace = true
rust-version.workspace = true
description = "NASA Redis 基础层：类型化命令、nonce 幂等 Pipeline、锁、Stream、可观测 Fanout 背压与 RedisJob"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
include = [
    "src/**/*.rs",
    "src/**/*.lua",
    "Cargo.toml",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "NOTICE",
]


[lib]
name = "nadis"
[features]
# search：RediSearch/RedisJSON 封装，包括 SearchActuator、JsonArrayOps 与查询 AST。
# 默认关闭：只用 lock/pipeline/partition 的服务不应编译 search；
# 门面侧经 "redis-search" 透传)。
search = []
# derive：重新导出 nadis-derive 的 #[derive(RedisDocument)]。
# 生成代码根路径经 nasa-macro-support 发现(直依=::nadis/门面=::nasa::redis),
# 故 derive 蕴含 search;消费者只需依赖 nadis(开 derive),无需直依宏 crate。
derive = ["dep:nadis-derive", "search"]
# job：完整分布式任务运行时（调度、执行器注册、租约、Fanout、drain）。
# 必须显式开启，避免只用基础命令与幂等计数的项目编译 Cron、Fanout 与后台运行时。
job = ["dep:base64", "dep:cron", "dep:chrono", "dep:chrono-tz"]
[dependencies]
# Job payload 的稳定 Base64 编码；仅 job feature 启用。
base64 = { version = "0.22", optional = true }
# Cron 表达式下一触发时刻计算；仅 job feature 启用（调度器触发引擎）。
cron = { version = "0.15", optional = true }
# 触发引擎的时刻与时区运算基座；仅 job feature 启用。
chrono = { version = "0.4", default-features = false, features = ["std", "clock"], optional = true }
# 触发引擎的命名时区解析（如 "UTC"、"Asia/Shanghai"）；仅 job feature 启用。
chrono-tz = { version = "0.10", optional = true }
nabase = { package = "nabase", version = "1.0.1" }
nadis-derive = { package = "nadis-derive", version = "1.0.0", optional = true }
redis = { version = "1", features = ["tokio-comp", "script", "connection-manager", "cluster-async"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
# preserve_order：Value 保持字段插入顺序（即结构体声明顺序），省略 null 时不会
# BTreeMap 字母序重排,维持与 原实现(Jackson 声明序)的 JSON 字节对齐。
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
futures = "0.3"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
# nonce 幂等计数的跨语言账本身份与 canonical slot token 摘要；与 Java SHA-256 逐字节一致。
sha2 = "0.10"
hex = "0.4"
