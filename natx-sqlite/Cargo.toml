[package]
name = "natx-sqlite"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Managed SQLite file ownership, bounded SQL execution, ambient transactions and consistent backups"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["sqlite", "transaction", "database", "async"]
categories = ["database", "asynchronous"]
readme = "README.md"

[dependencies]
nametrics-core = { version = "2.0.0" }
natx-core = { version = "2.0.1" }
natx-macro = { version = "2.0.1" }
nabudget = { version = "2.0.0" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros"] }
sqlx-core = { version = "0.9", default-features = false }
libsqlite3-sys = "0.37"
libc = "0.2"
tokio = { version = "1", features = ["sync", "rt", "time"] }
futures-core = "0.3"
futures-util = "0.3"
futures-executor = "0.3"
async-stream = "0.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
