[package]
name = "nasaga-macro"
version = "1.0.2"
edition.workspace = true
rust-version.workspace = true
description = "NASA Saga #[saga] participant step attribute macro with compile-time contract checks"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["saga", "workflow", "macro", "compensation", "microservices"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true
name = "nasaga_macro"

[dependencies]
nasa-macro-support = { package = "macro-support", version = "1.0.1" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
