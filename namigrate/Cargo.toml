[package]
name = "namigrate"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
description = "MySQL migration validation and apply gate with bounded advisory locking"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["mysql", "migration", "schema", "database", "runtime"]
categories = ["database", "asynchronous"]

[dependencies]
namigrate-core = { version = "2.0.0" }
natx-core = { version = "2.0.0" }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "mysql", "migrate"] }
tokio = { version = "1", features = ["time"] }
