# numeric —— 面向金额、价格和最小变动单位的定点与任意精度算术 crate。
# i128 定点核限制 scale≤8；multiply/divide 的余数路径使用 f64，to_fixed_f64 的 tie 朝正无穷舍入。
# decimal 模块不受 fixed scale 上限限制，展开 10^n 的操作受 MAX_DECIMAL_EXPANSION 保护。
[package]
name = "nanum"
version = "1.0.2"
edition.workspace = true
rust-version.workspace = true
description = "NASA 定点与任意精度算术：i128 定点、完整舍入模式、align 与有界 BigDecimal 运算"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true


[lib]
name = "nanum"
[dependencies]
rand = "0.8"
# BigDecimal 高精度段不受 fixed MAX_SCALE=8 限制；凡需展开 10^n 的操作
# (divide/avg/align*/multiply_scale)受 decimal::MAX_DECIMAL_EXPANSION 边界保护，超界返回 Err。
# BigDecimal 是公开数值输入的一部分，因此保持为普通依赖并复用其 BigInt 类型处理极端 exponent。
bigdecimal = "0.4"
