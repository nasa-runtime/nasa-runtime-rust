# nalog —— 基于 tracing 的日志运行时。
# 提供可配置 formatter、运行期级别热切、按天和按大小滚动、保留上限与独立 error.log。
# 业务通过 `nasa::log` 门面使用；crate 名避免与 crates.io 的 `log` 包冲突。
[package]
name = "nalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "NASA tracing 日志：可配置格式、级别热切、按天/大小滚动、保留上限与独立错误文件"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true


[lib]
name = "nalog"
[dependencies]
nabase = { package = "nabase", version = "1.0.0" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
arc-swap = "1"
# 应用侧 LogConfig 反序列化(业务直接把 YAML/Nacos 的 log: 段反序列化进 nlog::LogConfig)。
# 默认启用,避免门面 nasa 再多配一个 log-config feature。
serde = { version = "1", features = ["derive"] }
