[package]
name = "napp-macro"
version = "2.0.1"
edition.workspace = true
rust-version.workspace = true
description = "NASA application macros for managed lifecycles, multi-registry discovery and ordered initializers"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["runtime", "lifecycle", "initializer", "discovery", "async"]
categories.workspace = true

[lib]
proc-macro = true

[dependencies]
nasa-macro-support = { package = "macro-support", version = "2.0.0" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
