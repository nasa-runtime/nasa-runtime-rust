[package]
name = "napp-macro"
version = "1.0.2"
edition.workspace = true
rust-version.workspace = true
description = "NASA application entry and dependency-ordered initializer attributes"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["runtime", "lifecycle", "initializer", "microservices", "async"]
categories.workspace = true

[lib]
proc-macro = true

[dependencies]
nasa-macro-support = { package = "macro-support", version = "1.0.1" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
